<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>FX GUARD</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.wrap{max-width:520px;margin:auto;padding:18px 14px 32px}.top{display:flex;justify-content:space-between;align-items:end}
h1{margin:0;font-size:29px}.sub{color:#6b7280;font-size:12px;margin:2px 0 16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.label{font-size:12px;color:#6b7280}.big{font-size:24px;font-weight:800;margin-top:4px}
input{width:100%;font-size:18px;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px;background:#fff}
button{width:100%;min-height:48px;border:0;border-radius:12px;font-size:16px;font-weight:800;margin-top:10px}.primary{background:#111827;color:#fff}
.status{border-radius:14px;padding:16px;text-align:center;font-weight:800;font-size:18px}.safe{background:#ecfdf5;border:1px solid #a7f3d0}.warn{background:#fff7ed;border:1px solid #fed7aa}.danger{background:#fef2f2;border:2px solid #fca5a5}
.rule{font-size:18px;font-weight:800}.lock{font-size:12px;color:#6b7280;margin-top:8px;line-height:1.5}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:14px}.check input{width:20px;height:20px;margin:0}
#guard{font-size:13px;color:#6b7280}.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>FX GUARD</h1><div class="sub">スマホ暴走防止 / 5%デイリー管理</div></div></div>

<div class="card">
<div class="label">今日の開始証拠金</div><input id="start" type="number" inputmode="decimal" value="45000">
<div class="label" style="margin-top:12px">現在の証拠金</div><input id="now" type="number" inputmode="decimal" value="45000">
</div>

<div class="grid">
<div class="card"><div class="label">5%目標利益</div><div class="big" id="target">2,250円</div></div>
<div class="card"><div class="label">今日の利益</div><div class="big" id="profit">+0円</div></div>
</div>

<div id="status" class="status safe">🟢 取引可能 — 許可ロットを守る</div>

<div class="card">
<div class="label">今日の最重要ルール</div>
<div class="rule">5%を取ったら終了。</div>
<div class="lock">負けを取り返すためのロットアップ禁止。調子が良いからロットアップも禁止。</div>
</div>

<div class="card">
<div class="label">注文前チェック</div>
<label class="check"><input class="ck" type="checkbox"> 許可ロットを確認した</label>
<label class="check"><input class="ck" type="checkbox"> 取り返そうとしていない</label>
<label class="check"><input class="ck" type="checkbox"> エントリー条件を満たしている</label>
<label class="check"><input class="ck" type="checkbox"> 5%達成後は終了する</label>
</div>

<div class="card">
<div class="label">今日の最大許可ロット</div>
<input id="lot" type="text" inputmode="decimal" placeholder="例：0.10 lot">
<div class="lock">今は手入力。後でEA/Excelのルールから自動表示する。</div>
</div>

<button class="primary" id="calc">現在状況を判定</button>
<button id="finish">🛑 今日は終了する</button>
<div id="guard">この画面は「もっと取る」ためではなく「余計な1回をしない」ための画面です。</div>
</div>
<script>
(()=>{const $=id=>document.getElementById(id), yen=n=>Math.round(n).toLocaleString("ja-JP")+"円";
function calc(){const s=Math.max(0,Number($("start").value)||0),n=Math.max(0,Number($("now").value)||0),t=s*.05,p=n-s;
$("target").textContent=yen(t);$("profit").textContent=(p>=0?"+":"-")+yen(Math.abs(p));
const st=$("status");if(t>0&&p>=t){st.className="status danger";st.textContent="🛑 5%達成 — 本日の取引終了";localStorage.setItem("fxguardLocked","1")}
else if(p<0){st.className="status warn";st.textContent="⚠️ 現在マイナス — ロットアップ禁止"}
else{st.className="status safe";st.textContent="🟢 取引可能 — 許可ロットを守る"}}
$("calc").onclick=calc;$("start").oninput=calc;$("now").oninput=calc;
$("finish").onclick=()=>{localStorage.setItem("fxguardLocked","1");$("status").className="status danger";$("status").textContent="🛑 本日は終了。明日に持ち越す"};
calc();
})();
</script>
</body></html>
